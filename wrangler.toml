name = "routehub-egern"
main = "routehub-egern-worker.js"
compatibility_date = "2026-06-01"

# СТЕНД EGERN (блок 4, шаг 4.1). Отдельный Worker, отдельная D1.
#   * Имя Worker'а ДРУГОЕ (routehub-egern) — боевой routehub этой веткой
#     не затрагивается ни при каких настройках сборки.
#   * База ДРУГАЯ (routehub-egern-db). Общая недопустима: первое обращение
#     стенда перепривязало бы nonce боевых устройств (вывод 12 в СТАРТ.md).
#   * cron не заводится: стенду фоновое обновление подписки не нужно,
#     а квоты Cloudflare считаются на аккаунт.
#   * Правило Text для *.html не заводится: админ-панели у стенда пока нет.
# Секреты Cloudflare (тип Secret, НЕ Text — plaintext-переменные стираются
# каждым деплоем из этого файла): SUBSCRIPTION_URL, SUB_HWID, ADMIN_KEY.
# Заводятся Дианой в карточке ЭТОГО Worker'а; с боевым они не общие.

[[d1_databases]]
binding = "RH_DB"
database_name = "routehub-egern-db"
database_id = "55ebdd96-f6d4-453a-891a-4662ff5366dd"
