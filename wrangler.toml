name = "routehub"
main = "routehub-worker.js"
compatibility_date = "2026-06-01"

# Worker v1.9.0 (2026-08-05):
#   * Биндинг RH_KV УБРАН. Миграция KV -> D1 завершена 2026-08-03, обращений к KV
#     в коде больше нет (сняты /admin/backup, /admin/migrate, /admin/verify).
#     Сам namespace routehub-kv в аккаунте ОСТАВЛЕН — удаляет Диана; путь отката
#     до её удаления: вернуть предыдущую версию routehub-worker.js и этого файла.
#   * Добавлено правило Text для *.html: routehub-admin.html вбирается в бандл
#     при сборке и импортируется в Worker (import ADMIN_HTML). Панель отдаётся
#     мгновенно, без обращения к raw GitHub и без его пятиминутного кэша.
#     Правило действует только на статически импортированные файлы, поэтому
#     routehub-dash.html (его тянет скрипт на устройстве) в бандл не попадает.
# Секреты Cloudflare (тип Secret, НЕ Text — plaintext-переменные стираются
# каждым деплоем из этого файла): SUBSCRIPTION_URL, SUB_HWID, ADMIN_KEY.
# cron — фоновое обновление подписки раз в 2 часа. Он же задаёт верхнюю границу
# свежести кэша независимо от FRESH_MS (с v1.9.0 — 60 мин).

[triggers]
crons = ["0 */2 * * *"]

# v1.12.0 (T-private-repo): в сборку как Text вбираются и файлы, которые тянет
# устройство, — routehub.conf, scripts/*.js, probes/*.js, plugins/*.plugin,
# plugins/*.stoverride. Список импортов — src/files.js; отдаёт их маршрут
# /t/<токен>/repo/<путь> (src/repo.js). Префикс **/ обязателен: без него
# правило не срабатывает (проверено dry-run 24.09). Действует только на
# статически импортированные файлы: src/*.js под **/scripts/*.js не подпадает.
# fallthrough = true — правило не отключает встроенные правила Wrangler
# (Text для *.txt, *.sql и т. д.), как было бы по умолчанию.
[[rules]]
type = "Text"
globs = ["**/*.html", "**/scripts/*.js", "**/probes/*.js", "**/*.plugin", "**/*.stoverride", "**/*.conf"]
fallthrough = true

[[d1_databases]]
binding = "RH_DB"
database_name = "routehub-db"
database_id = "b03b5540-80aa-43e6-9dce-92bd8e221507"

# [vars] с CONFIG_URL УБРАН в v1.12.0: routehub.conf встроен в сборку, Worker
# его больше не запрашивает, а база скриптов строится от адреса запроса.
# Оставленная переменная выглядела бы действующим источником конфига.
# Откат версии в Cloudflare возвращает и её привязки, так что для отката
# переменная здесь не нужна.

# ───────────────────────────────────────────────────────────────────────────
# СТЕНД STASH (ADR-01, 2026-08-16). Деплоится из ЭТОЙ ЖЕ ветки командой
#   npx wrangler deploy --env stash
# Отдельный Worker-сервис и отдельная база: рантайм и данные изолированы от
# боевого, а код общий — правка ядра не копируется руками между ветками.
# ВНИМАНИЕ: ключи d1_databases, vars, rules, triggers НЕ наследуются из
# верхнего уровня — если переопределён хоть один, задавать нужно все.
# ВАЖНО про боевой билд: появление окружений включает предупреждение wrangler
# о неявном выборе окружения. Команду деплоя боевого воркера в дашборде
# перевести на `npx wrangler deploy --env=""` — это явно указывает верхний
# уровень. Проверено dry-run 16.08: без флага сейчас тоже берётся верхний
# уровень с базой routehub-db, но полагаться на умолчание не стоит.
[env.stash]
name = "routehub-stash"

[[env.stash.rules]]
type = "Text"
globs = ["**/*.html", "**/scripts/*.js", "**/probes/*.js", "**/*.plugin", "**/*.stoverride", "**/*.conf"]
fallthrough = true

[[env.stash.d1_databases]]
binding = "RH_DB"
database_name = "routehub-stash-db"
database_id = "6ba57fd5-c707-410c-a2ea-428156d06f88"

# [env.stash.vars] с CONFIG_URL (routehub-stash.yaml, так и не созданный)
# УБРАН в v1.12.0 вместе с боевым: код main переменную больше не читает.
# Свой конфиг стенда, если понадобится, встраивается так же, через src/files.js.

[env.stash.triggers]
crons = []
