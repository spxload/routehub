# =============================================================
# RouteHub — МИНИМАЛЬНЫЙ КОНФИГ STASH ДЛЯ ПРОБЫ ST1
# =============================================================
# НАЗНАЧЕНИЕ: дать Stash рабочий профиль, чтобы поднялся туннель и
# запустилось плановое задание. УЗЛОВ ЗДЕСЬ НЕТ СОЗНАТЕЛЬНО.
#
# ЧТО ЭТО ЗНАЧИТ НА ПРАКТИКЕ: весь трафик идёт напрямую (DIRECT), то есть
# телефон работает так же, как без VPN. На время пробы ИИ-сервисы и прочее
# заблокированное будут недоступны — это ожидаемо, проба занимает минуты.
#
# ОСНОВАНИЯ (документация Stash):
#   — конфиг обязателен, но у всех полей есть значения по умолчанию;
#   — группа без прокси трактуется как DIRECT;
#   — плановые задания требуют подключённого Network Extension (VPN).
#
# УСТАНОВКА: Stash → Настройки → Конфигурационный файл → Загрузить по ссылке:
#   https://raw.githubusercontent.com/spxload/routehub/main/routehub-stash-probe.yaml
# Затем выбрать этот конфиг активным и включить туннель (Loon выключить).
# Отдельный override ставить НЕ НУЖНО: секции пробы уже внутри этого файла.
#
# ОТЧЁТ: https://routehub-egern.proton4iker.workers.dev/ingest/rh-drop-2026?src=stash-ST1
# Подробности — ЭТАП_K_STASH.md (ветка main).
# =============================================================

mode: rule
log-level: warning
ipv6: false
allow-lan: false

proxy-groups:
  - name: RH-Проба
    type: select
    proxies:
      - DIRECT

rules:
  - MATCH,DIRECT

# --- собственно проба ----------------------------------------
script-providers:
  routehub-probe-stash:
    url: https://raw.githubusercontent.com/spxload/routehub/main/routehub-probe-stash.js
    interval: 86400

cron:
  script:
    - name: routehub-probe-stash
      cron: '*/5 * * * *'
      timeout: 40
      # Шаг 9 (адресация узла через X-Stash-Selected-Proxy) в этом конфиге
      # пропускается: узлов нет. Когда появится хотя бы один узел —
      # добавить сюда строку вида:
      # argument: '{"node":"точное имя узла из профиля"}'
