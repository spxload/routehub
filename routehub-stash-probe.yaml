# =============================================================
# RouteHub — КОНФИГ STASH ДЛЯ ПРОБЫ ST3 (ЛОКАЛЬНЫЙ КОНТРОЛЛЕР)
# =============================================================
# ВОПРОС ПРОБЫ: можно ли управлять политикой из скрипта через локальный
# контроллер. Основание: в ST2 в `$environment` найдены поля
# `controller-url` и `controller-authorization`, в документации не описанные.
# Прямого API управления в среде НЕТ (только шесть $-объектов).
#
# ЗАПРОСЫ ЛОКАЛЬНЫЕ — whitelist РКН им не мешает, сеть наружу не нужна.
# БОЕВОЙ КОНТУР НЕ ЗАТРАГИВАЕТСЯ: единственная запись — выбор `DIRECT`
# в группе `RH-Проба` этого же конфига, где `DIRECT` и так единственный член.
# Состояние не меняется, проверяется сам факт успешной записи.
#
# УСТАНОВКА (при включённом Loon): Stash → Настройки → Конфигурационный
#   файл → Загрузить по ссылке, старую копию удалить:
#   https://raw.githubusercontent.com/spxload/routehub/main/routehub-stash-probe.yaml
# ЗАПУСК: Loon выкл → Stash вкл → плитка «RouteHub ST3» либо ждать две минуты.
# РЕЗУЛЬТАТ: ключи RH_ST3_sum, RH_ST3_proxies, RH_ST3_raw в хранилище скриптов
#   плюс сводка на плитке и в уведомлении.
# ТОКЕН КОНТРОЛЛЕРА В ОТЧЁТ НЕ ПОПАДАЕТ — только его длина и форма.
# =============================================================

mode: rule
log-level: warning
ipv6: false
allow-lan: false

proxy-groups:
  - name: RH-Проба
    type: select
    proxies:
      - DIRECT

rules:
  - MATCH,DIRECT

tiles:
  - name: routehub-probe-st3
    interval: 600
    title: 'RouteHub ST3'
    content: 'обновить панель = запустить пробу'
    icon: 'antenna.radiowaves.left.and.right'
    backgroundColor: '#663399'

cron:
  script:
    - name: routehub-probe-st3
      cron: '*/2 * * * *'
      timeout: 40

script-providers:
  routehub-probe-st3:
    interval: 86400
    payload: |
      // RouteHub — ПРОБА STASH. Ревизия ST3: локальный контроллер.
      // Цель: доказать или опровергнуть управление политикой из скрипта.
      // Шаги: среда → globalProxy → /version → /configs → /proxies → PUT → сверка.
      var REV = 'ST3';
      var GROUP = 'RH-Проба';
      var PICK = 'DIRECT';
      var G = (typeof globalThis !== 'undefined') ? globalThis : this;
      var T0 = Date.now();
      var FIN = false;
      var rep = { rev: REV, ts: new Date().toISOString(), steps: {}, errors: [] };
      var BASE = null, AUTH = null, AUTH_MODE = null;

      function has(n) { try { return typeof G[n]; } catch (e) { return 'error'; } }
      function safe(name, fn) {
        var t = Date.now();
        try { rep.steps[name] = fn(); }
        catch (e) { rep.errors.push(name + ': ' + String((e && e.message) || e)); }
        rep.steps['_ms_' + name] = Date.now() - t;
      }

      // ШАГ 1. Среда. Токен не раскрывается: только длина и признаки.
      safe('env', function () {
        var r = { available: has('$environment') };
        if (r.available === 'undefined') return r;
        var e = G.$environment;
        r.keys = [];
        try { r.keys = Object.getOwnPropertyNames(e).sort(); } catch (x) {}
        r.version = e['stash-version'];
        r.build = e['stash-build'];
        r.system = e.system;
        r.device = e['device-model'];
        var u = e['controller-url'];
        var a = e['controller-authorization'];
        r.controller_url = u ? String(u) : null;
        r.auth_present = !!a;
        r.auth_len = a ? String(a).length : 0;
        r.auth_has_bearer = a ? (String(a).slice(0, 7).toLowerCase() === 'bearer ') : false;
        if (u) BASE = String(u).replace(/\/+$/, '');
        if (a) AUTH = String(a);
        return r;
      });

      // ШАГ 2. Неописанный член $httpClient.globalProxy.
      safe('global_proxy', function () {
        if (has('$httpClient') === 'undefined') return { available: false };
        var r = { type: typeof G.$httpClient.globalProxy };
        try { r.value = JSON.stringify(G.$httpClient.globalProxy); } catch (e) { r.value = 'unserializable'; }
        try {
          var v = G.$httpClient.globalProxy;
          if (v && (typeof v === 'object' || typeof v === 'function')) {
            r.members = Object.getOwnPropertyNames(v).sort();
          }
        } catch (e) {}
        return r;
      });

      function hdr() {
        var h = { 'Content-Type': 'application/json' };
        if (AUTH) h.Authorization = (AUTH_MODE === 'bearer') ? ('Bearer ' + AUTH) : AUTH;
        return h;
      }

      function call(method, path, body, cb) {
        if (!BASE) { cb({ error: 'нет controller-url' }); return; }
        if (has('$httpClient') === 'undefined') { cb({ error: 'no $httpClient' }); return; }
        var t = Date.now(), fired = false;
        var opts = { url: BASE + path, headers: hdr(), timeout: 6 };
        if (body !== null && body !== undefined) opts.body = JSON.stringify(body);
        function once(o) { if (!fired) { fired = true; cb(o); } }
        setTimeout(function () { once({ error: 'таймаут 7 с', ms: Date.now() - t }); }, 7000);
        try {
          G.$httpClient[method](opts, function (err, resp, data) {
            once({
              ms: Date.now() - t,
              error: err ? String(err) : null,
              status: resp ? (resp.status || resp.statusCode) : null,
              body_len: data ? String(data).length : 0,
              body: data ? String(data).slice(0, 4000) : ''
            });
          });
        } catch (e) {
          once({ error: 'throw: ' + String((e && e.message) || e), ms: Date.now() - t });
        }
      }

      // ШАГ 3. /version — есть ли контроллер и какой вид авторизации верен.
      function step_version_raw() {
        AUTH_MODE = 'raw';
        call('get', '/version', null, function (r) {
          rep.steps.version_raw = r;
          if (r.status && r.status >= 200 && r.status < 300) { step_configs(); return; }
          step_version_bearer();
        });
      }

      function step_version_bearer() {
        AUTH_MODE = 'bearer';
        call('get', '/version', null, function (r) {
          rep.steps.version_bearer = r;
          if (r.status && r.status >= 200 && r.status < 300) { step_configs(); return; }
          AUTH_MODE = 'raw';
          finish('контроллер не ответил');
        });
      }

      // ШАГ 4. /configs — режим и настройки ядра.
      function step_configs() {
        call('get', '/configs', null, function (r) {
          rep.steps.configs = r;
          step_proxies();
        });
      }

      // ШАГ 5. /proxies — видны ли группы и их члены.
      function step_proxies() {
        call('get', '/proxies', null, function (r) {
          rep.steps.proxies = { ms: r.ms, status: r.status, error: r.error, body_len: r.body_len };
          rep.proxies_raw = r.body || '';
          try {
            var o = JSON.parse(r.body || '{}');
            var names = Object.keys(o.proxies || {});
            var groups = [];
            for (var i = 0; i < names.length; i++) {
              var p = o.proxies[names[i]];
              if (p && p.all) groups.push({ name: names[i], type: p.type, now: p.now, members: p.all.length });
            }
            rep.steps.proxies.total = names.length;
            rep.steps.proxies.groups = groups;
          } catch (e) { rep.steps.proxies.parse_err = String((e && e.message) || e); }
          step_put();
        });
      }

      // ШАГ 6. ЗАПИСЬ: выбор DIRECT в собственной группе пробы.
      // В Clash-совместимом API успех — код 204.
      function step_put() {
        call('put', '/proxies/' + encodeURIComponent(GROUP), { name: PICK }, function (r) {
          rep.steps.put = r;
          step_check();
        });
      }

      // ШАГ 7. Сверка: что теперь выбрано в группе.
      function step_check() {
        call('get', '/proxies/' + encodeURIComponent(GROUP), null, function (r) {
          rep.steps.check = r;
          var ok = rep.steps.put && rep.steps.put.status && rep.steps.put.status >= 200 && rep.steps.put.status < 300;
          finish(ok ? 'ЗАПИСЬ ПРОШЛА' : 'запись отклонена');
        });
      }

      function finish(note) {
        if (FIN) return;
        FIN = true;
        rep.total_ms = Date.now() - T0;
        var env = rep.steps.env || {};
        var pr = rep.steps.proxies || {};
        var sum = {
          rev: REV, ts: rep.ts, note: note || '',
          stash: env.version + ' (' + env.build + ')',
          controller_url: env.controller_url,
          auth_present: env.auth_present, auth_len: env.auth_len, auth_mode: AUTH_MODE,
          env_keys: env.keys,
          global_proxy: rep.steps.global_proxy,
          version: rep.steps.version_raw ? { raw: rep.steps.version_raw.status, bearer: rep.steps.version_bearer ? rep.steps.version_bearer.status : null, body: (rep.steps.version_raw.body || '').slice(0, 200) } : null,
          configs_status: rep.steps.configs ? rep.steps.configs.status : null,
          proxies_total: pr.total, groups: pr.groups,
          put: rep.steps.put ? { status: rep.steps.put.status, error: rep.steps.put.error, body: (rep.steps.put.body || '').slice(0, 200) } : null,
          check: rep.steps.check ? { status: rep.steps.check.status, body: (rep.steps.check.body || '').slice(0, 300) } : null,
          errors: rep.errors, total_ms: rep.total_ms
        };
        try { G.$persistentStore.write(JSON.stringify(sum), 'RH_ST3_sum'); } catch (e) {}
        try { G.$persistentStore.write(String(rep.proxies_raw || ''), 'RH_ST3_proxies'); } catch (e) {}
        try { G.$persistentStore.write(JSON.stringify(rep), 'RH_ST3_raw'); } catch (e) {}
        try { console.log('[RH-ST3-SUM] ' + JSON.stringify(sum)); } catch (e) {}
        try { console.log('[RH-ST3-FULL] ' + JSON.stringify(rep)); } catch (e) {}
        var line = 'контроллер: ' + (sum.version && sum.version.raw ? 'да' : 'нет') +
          ' · групп: ' + ((sum.groups && sum.groups.length) || 0) +
          ' · запись: ' + ((sum.put && sum.put.status) || '—');
        try { G.$notification.post('RouteHub ST3', note || '', line); } catch (e) {}
        try {
          G.$done({ title: 'RouteHub ST3', content: line, icon: 'antenna.radiowaves.left.and.right', backgroundColor: '#663399' });
        } catch (e) {
          try { G.$done({}); } catch (e2) {}
        }
      }

      setTimeout(function () { finish('исчерпан бюджет 30 с'); }, 30000);

      if (!BASE) finish('controller-url отсутствует'); else step_version_raw();
      // конец файла
