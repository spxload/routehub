# =============================================================
# RouteHub — КОНФИГ STASH ДЛЯ ПРОБЫ ST4 (КАРТА КОНТРОЛЛЕРА)
# =============================================================
# ЧТО УЖЕ ДОКАЗАНО (ST3, Stash 3.4.1 build 1248):
#   — контроллер ЖИВ: http://127.0.0.1:9090 отвечает за 25-52 мс;
#   — ответ «404 page not found» — стандартная страница Go-роутера,
#     то есть путь неверен, а НЕ авторизация (та дала бы 401);
#   — Clash-путь /version отсутствует как с токеном как есть, так и с Bearer;
#   — `$httpClient.globalProxy` — СТРОКА (сейчас пустая): вероятно, имя
#     прокси по умолчанию для всех запросов скрипта.
#
# ЗАДАЧА ST4: найти реальные пути контроллера сплошным перебором
# кандидатов (вывод 54: отсутствие доказывается только сплошной описью).
# ТОЛЬКО ЧТЕНИЕ: ни одного записывающего запроса. Запись — следующая
# ревизия, когда будет известен верный путь.
# Стримы (/traffic, /logs, /memory) исключены: они не закрывают соединение.
#
# УСТАНОВКА (при включённом Loon), старую копию удалить:
#   https://raw.githubusercontent.com/spxload/routehub/main/routehub-stash-probe.yaml
# ЗАПУСК: Loon выкл → Stash вкл → плитка «RouteHub ST4».
# РЕЗУЛЬТАТ: RH_ST4_sum (сводка), RH_ST4_hits (тела ответивших путей).
# Токен контроллера в отчёт НЕ попадает.
# =============================================================

mode: rule
log-level: warning
ipv6: false
allow-lan: false

proxy-groups:
  - name: RH-Проба
    type: select
    proxies:
      - DIRECT

rules:
  - MATCH,DIRECT

tiles:
  - name: routehub-probe-st4
    interval: 600
    title: 'RouteHub ST4'
    content: 'обновить панель = запустить пробу'
    icon: 'map'
    backgroundColor: '#663399'

cron:
  script:
    - name: routehub-probe-st4
      cron: '*/2 * * * *'
      timeout: 40

script-providers:
  routehub-probe-st4:
    interval: 86400
    payload: |
      // RouteHub — ПРОБА STASH. Ревизия ST4: карта локального контроллера.
      // ТОЛЬКО ЧТЕНИЕ. Перебор путей в два захода: с токеном и без него.
      var REV = 'ST4';
      var G = (typeof globalThis !== 'undefined') ? globalThis : this;
      var T0 = Date.now();
      var FIN = false;
      var rep = { rev: REV, ts: new Date().toISOString(), steps: {}, probe: [], errors: [] };
      var BASE = null, AUTH = null;

      var PATHS = [
        '/', '/version', '/status', '/health', '/info',
        '/api', '/api/version', '/api/v1/version', '/v1/version',
        '/stash', '/stash/version', '/rest/version',
        '/proxies', '/api/proxies', '/v1/proxies', '/policies', '/policy', '/groups',
        '/configs', '/config', '/rules', '/connections', '/providers/proxies',
        '/scripts', '/tiles', '/profile', '/ui', '/dns/query?name=example.com&type=A'
      ];

      function has(n) { try { return typeof G[n]; } catch (e) { return 'error'; } }

      // Среда: адрес и токен. Токен не раскрывается.
      try {
        var e = G.$environment;
        if (e) {
          if (e['controller-url']) BASE = String(e['controller-url']).replace(/\/+$/, '');
          if (e['controller-authorization']) AUTH = String(e['controller-authorization']);
          rep.steps.env = {
            url: BASE, auth_len: AUTH ? AUTH.length : 0,
            version: e['stash-version'], build: e['stash-build']
          };
        }
      } catch (x) { rep.errors.push('env: ' + String(x)); }

      function call(path, withAuth, cb) {
        var t = Date.now(), fired = false;
        var h = { 'Content-Type': 'application/json' };
        if (withAuth && AUTH) h.Authorization = AUTH;
        function once(o) { if (!fired) { fired = true; cb(o); } }
        setTimeout(function () { once({ path: path, auth: !!withAuth, status: null, error: 'таймаут 4 с', ms: Date.now() - t }); }, 4000);
        try {
          G.$httpClient.get({ url: BASE + path, headers: h, timeout: 3 }, function (err, resp, data) {
            var hd = null;
            try { hd = resp && resp.headers ? resp.headers : null; } catch (z) {}
            once({
              path: path, auth: !!withAuth, ms: Date.now() - t,
              status: resp ? (resp.status || resp.statusCode) : null,
              error: err ? String(err) : null,
              len: data ? String(data).length : 0,
              head: data ? String(data).slice(0, 300) : '',
              headers: hd
            });
          });
        } catch (z) {
          once({ path: path, auth: !!withAuth, status: null, error: 'throw: ' + String(z), ms: Date.now() - t });
        }
      }

      // Заход 1 — с токеном, по всем путям. Заход 2 — без токена,
      // только по тем, где ответ отличался от 404 (чтобы различить
      // «пути нет» и «путь есть, но закрыт»).
      var i = 0;
      function walk() {
        if (i >= PATHS.length) { second(); return; }
        if (Date.now() - T0 > 26000) { rep.errors.push('бюджет исчерпан на ' + i + ' из ' + PATHS.length); second(); return; }
        var p = PATHS[i++];
        call(p, true, function (r) { rep.probe.push(r); walk(); });
      }

      var alt = [], j = 0;
      function second() {
        if (!alt.length) {
          for (var k = 0; k < rep.probe.length; k++) {
            var r = rep.probe[k];
            if (r.status !== null && r.status !== 404) alt.push(r.path);
          }
          if (!alt.length) alt.push('/');
        }
        if (j >= alt.length || Date.now() - T0 > 29000) { finish(); return; }
        var p = alt[j++];
        call(p, false, function (r) { rep.probe.push(r); second(); });
      }

      function finish() {
        if (FIN) return;
        FIN = true;
        rep.total_ms = Date.now() - T0;
        var hits = [], notfound = 0, dead = 0;
        for (var k = 0; k < rep.probe.length; k++) {
          var r = rep.probe[k];
          if (r.status === 404) { notfound++; continue; }
          if (r.status === null) { dead++; continue; }
          hits.push(r);
        }
        var sum = {
          rev: REV, ts: rep.ts,
          stash: rep.steps.env ? (rep.steps.env.version + ' (' + rep.steps.env.build + ')') : null,
          url: BASE, auth_len: rep.steps.env ? rep.steps.env.auth_len : 0,
          checked: rep.probe.length, notfound: notfound, no_answer: dead,
          hits: hits.map(function (r) {
            return { path: r.path, auth: r.auth, status: r.status, len: r.len, head: (r.head || '').slice(0, 200) };
          }),
          errors: rep.errors, total_ms: rep.total_ms
        };
        try { G.$persistentStore.write(JSON.stringify(sum), 'RH_ST4_sum'); } catch (z) {}
        try { G.$persistentStore.write(JSON.stringify(hits), 'RH_ST4_hits'); } catch (z) {}
        try { console.log('[RH-ST4-SUM] ' + JSON.stringify(sum)); } catch (z) {}
        try { console.log('[RH-ST4-FULL] ' + JSON.stringify(rep)); } catch (z) {}
        var line = 'путей ' + sum.checked + ' · откликнулось ' + sum.hits.length + ' · 404: ' + notfound;
        try { G.$notification.post('RouteHub ST4', sum.hits.length ? 'есть отклик' : 'всё 404', line); } catch (z) {}
        try {
          G.$done({ title: 'RouteHub ST4', content: line, icon: 'map', backgroundColor: '#663399' });
        } catch (z) {
          try { G.$done({}); } catch (z2) {}
        }
      }

      setTimeout(function () { finish(); }, 32000);

      if (!BASE || has('$httpClient') === 'undefined') {
        rep.errors.push('нет controller-url или $httpClient');
        finish();
      } else {
        walk();
      }
      // конец файла
