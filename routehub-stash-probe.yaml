# =============================================================
# RouteHub — КОНФИГ STASH ДЛЯ ПРОБЫ ST5 (ЗАПИСЬ В КОНТРОЛЛЕР)
# =============================================================
# ДОКАЗАНО В ST4 (Stash 3.4.1 build 1248, iOS 26.5.2):
#   — на http://127.0.0.1:9090 работает Clash-совместимый API без пути /version;
#   — отвечают: / , /proxies , /configs , /rules , /connections , /providers/proxies;
#   — без токена все они дают 401 — токен из $environment действителен;
#   — группы видны как Selector: GLOBAL (now=PROXY), PROXY, RH-Проба.
#
# ЗАДАЧА ST5: проверить ЗАПИСЬ — то есть управление политикой из скрипта,
# которого нет ни в Egern, ни через прямое API самого Stash.
#
# БЕЗОПАСНОСТЬ ЗАПИСЕЙ:
#   — PUT /proxies/RH-Проба → DIRECT: в этой группе DIRECT и так единственный член;
#   — PATCH /configs → mode "rule": режим уже rule, значение не меняется;
#   — узлов в этом профиле нет вовсе, боевой контур не затрагивается;
#   — DELETE соединений НЕ выполняется сознательно.
#
# УСТАНОВКА (при включённом Loon), старую копию удалить:
#   https://raw.githubusercontent.com/spxload/routehub/main/routehub-stash-probe.yaml
# ЗАПУСК: Loon выкл → Stash вкл → плитка «RouteHub ST5».
# РЕЗУЛЬТАТ: RH_ST5_sum, RH_ST5_raw.
# =============================================================

mode: rule
log-level: warning
ipv6: false
allow-lan: false

proxy-groups:
  - name: RH-Проба
    type: select
    proxies:
      - DIRECT

rules:
  - MATCH,DIRECT

tiles:
  - name: routehub-probe-st5
    interval: 600
    title: 'RouteHub ST5'
    content: 'обновить панель = запустить пробу'
    icon: 'switch.2'
    backgroundColor: '#663399'

cron:
  script:
    - name: routehub-probe-st5
      cron: '*/2 * * * *'
      timeout: 40

script-providers:
  routehub-probe-st5:
    interval: 86400
    payload: |
      // RouteHub — ПРОБА STASH. Ревизия ST5: запись в локальный контроллер.
      // Шаги: выбор в группе → сверка → замер задержки → режим → соединения → WebSocket.
      var REV = 'ST5';
      var GROUP = 'RH-Проба';
      var PICK = 'DIRECT';
      var G = (typeof globalThis !== 'undefined') ? globalThis : this;
      var T0 = Date.now();
      var FIN = false;
      var rep = { rev: REV, ts: new Date().toISOString(), steps: {}, errors: [] };
      var BASE = null, AUTH = null, TOKEN = null;

      try {
        var e = G.$environment;
        if (e) {
          if (e['controller-url']) BASE = String(e['controller-url']).replace(/\/+$/, '');
          if (e['controller-authorization']) {
            AUTH = String(e['controller-authorization']);
            TOKEN = AUTH.replace(/^[Bb]earer\s+/, '');
          }
          rep.steps.env = { url: BASE, version: e['stash-version'], build: e['stash-build'] };
        }
      } catch (x) { rep.errors.push('env: ' + String(x)); }

      function call(method, path, body, cb) {
        var t = Date.now(), fired = false;
        var opts = {
          url: BASE + path,
          headers: { 'Content-Type': 'application/json', Authorization: AUTH },
          timeout: 6
        };
        if (body !== null && body !== undefined) opts.body = JSON.stringify(body);
        function once(o) { if (!fired) { fired = true; cb(o); } }
        setTimeout(function () { once({ error: 'таймаут 7 с', ms: Date.now() - t, status: null }); }, 7000);
        try {
          G.$httpClient[method](opts, function (err, resp, data) {
            once({
              ms: Date.now() - t,
              status: resp ? (resp.status || resp.statusCode) : null,
              error: err ? String(err) : null,
              len: data ? String(data).length : 0,
              body: data ? String(data).slice(0, 1200) : ''
            });
          });
        } catch (z) { once({ error: 'throw: ' + String(z), ms: Date.now() - t, status: null }); }
      }

      // ШАГ 1. Состояние группы ДО записи.
      function s1() {
        call('get', '/proxies/' + encodeURIComponent(GROUP), null, function (r) {
          rep.steps.before = r;
          s2();
        });
      }

      // ШАГ 2. ЗАПИСЬ: выбор члена группы. В Clash-API успех — 204.
      function s2() {
        call('put', '/proxies/' + encodeURIComponent(GROUP), { name: PICK }, function (r) {
          rep.steps.put = r;
          s3();
        });
      }

      // ШАГ 3. Сверка ПОСЛЕ записи.
      function s3() {
        call('get', '/proxies/' + encodeURIComponent(GROUP), null, function (r) {
          rep.steps.after = r;
          s4();
        });
      }

      // ШАГ 4. Штатный замер задержки узла силами ядра.
      // Под whitelist замер провалится — важен САМ ФАКТ наличия эндпоинта.
      function s4() {
        var q = '/proxies/DIRECT/delay?timeout=3000&url=' +
          encodeURIComponent('http://connectivitycheck.gstatic.com/generate_204');
        call('get', q, null, function (r) {
          rep.steps.delay = r;
          s5();
        });
      }

      // ШАГ 5. ЗАПИСЬ настроек: тот же режим rule, значение не меняется.
      function s5() {
        call('patch', '/configs', { mode: 'rule' }, function (r) {
          rep.steps.patch_configs = r;
          s6();
        });
      }

      // ШАГ 6. Журнал соединений: сколько и какие поля в метаданных.
      // Вывод 8 гласит, что журнала трафика нет ни у одного клиента — проверяем.
      function s6() {
        call('get', '/connections', null, function (r) {
          var o = { ms: r.ms, status: r.status, len: r.len, error: r.error };
          try {
            var j = JSON.parse(r.body && r.len <= 1200 ? r.body : '{}');
            if (j.connections) {
              o.count = j.connections.length;
              o.upload_total = j.uploadTotal;
              o.download_total = j.downloadTotal;
              if (j.connections[0] && j.connections[0].metadata) {
                o.metadata_keys = Object.keys(j.connections[0].metadata).sort();
                o.sample_host = j.connections[0].metadata.host || j.connections[0].metadata.destinationIP || null;
              }
            }
          } catch (z) { o.note = 'тело обрезано, разбор пропущен'; }
          rep.steps.connections = o;
          s7();
        });
      }

      // ШАГ 7. WebSocket на /traffic. В Loon не соединяется, в Egern работает.
      function s7() {
        if (typeof G.WebSocket === 'undefined') {
          rep.steps.ws = { available: false };
          finish();
          return;
        }
        var res = { available: true, opened: false, messages: 0, sample: null, error: null };
        var closed = false;
        try {
          var wsUrl = BASE.replace(/^http/, 'ws') + '/traffic?token=' + encodeURIComponent(TOKEN || '');
          var ws = new G.WebSocket(wsUrl);
          ws.onopen = function () { res.opened = true; };
          ws.onmessage = function (ev) {
            res.messages++;
            if (!res.sample) { try { res.sample = String(ev.data).slice(0, 200); } catch (z) {} }
          };
          ws.onerror = function () { res.error = 'onerror'; };
          setTimeout(function () {
            if (closed) return;
            closed = true;
            try { res.readyState = ws.readyState; ws.close(); } catch (z) {}
            rep.steps.ws = res;
            finish();
          }, 5000);
        } catch (z) {
          res.error = 'throw: ' + String(z);
          rep.steps.ws = res;
          finish();
        }
      }

      function finish() {
        if (FIN) return;
        FIN = true;
        rep.total_ms = Date.now() - T0;
        var put = rep.steps.put || {};
        var ok = put.status && put.status >= 200 && put.status < 300;
        var sum = {
          rev: REV, ts: rep.ts,
          stash: rep.steps.env ? (rep.steps.env.version + ' (' + rep.steps.env.build + ')') : null,
          before: (rep.steps.before || {}).body,
          put_status: put.status, put_error: put.error, put_body: put.body,
          after: (rep.steps.after || {}).body,
          delay: rep.steps.delay ? { status: rep.steps.delay.status, body: rep.steps.delay.body } : null,
          patch_configs: rep.steps.patch_configs ? { status: rep.steps.patch_configs.status, body: rep.steps.patch_configs.body } : null,
          connections: rep.steps.connections,
          websocket: rep.steps.ws,
          verdict: ok ? 'ЗАПИСЬ ПРОШЛА' : 'запись отклонена',
          errors: rep.errors, total_ms: rep.total_ms
        };
        try { G.$persistentStore.write(JSON.stringify(sum), 'RH_ST5_sum'); } catch (z) {}
        try { G.$persistentStore.write(JSON.stringify(rep), 'RH_ST5_raw'); } catch (z) {}
        try { console.log('[RH-ST5-SUM] ' + JSON.stringify(sum)); } catch (z) {}
        var line = 'запись: ' + (put.status || '—') +
          ' · delay: ' + ((rep.steps.delay && rep.steps.delay.status) || '—') +
          ' · ws: ' + (rep.steps.ws && rep.steps.ws.opened ? 'открыт' : 'нет');
        try { G.$notification.post('RouteHub ST5', sum.verdict, line); } catch (z) {}
        try {
          G.$done({ title: 'RouteHub ST5', content: line, icon: 'switch.2', backgroundColor: '#663399' });
        } catch (z) {
          try { G.$done({}); } catch (z2) {}
        }
      }

      setTimeout(function () { finish(); }, 33000);

      if (!BASE || typeof G.$httpClient === 'undefined') {
        rep.errors.push('нет controller-url или $httpClient');
        finish();
      } else {
        s1();
      }
      // конец файла
