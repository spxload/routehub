name: Точечная правка текста

# Замена одного фрагмента в текстовом файле репозитория без пересылки файла целиком.
# Правка уходит не в ветку запуска, а в новую ветку patch/<номер запуска> с PR:
# коммит в main — автодеплой Cloudflare, поэтому в бой — только через Merge Дианы.
# Пуш от GITHUB_TOKEN не запускает tests.yml, поэтому тесты прогоняются здесь,
# в задании с правом только на чтение: правка может менять код, который тесты
# исполняют, и токен с записью ему не показывается.
on:
  workflow_dispatch:
    inputs:
      path:
        description: 'Путь к файлу'
        required: true
      old:
        description: 'Точный фрагмент (должен встречаться ровно один раз)'
        required: true
      new:
        description: 'Новый фрагмент'
        required: true
      message:
        description: 'Описание правки'
        required: false
        default: 'Точечная правка'

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Замена
        env:
          P: ${{ inputs.path }}
          OLD: ${{ inputs.old }}
          NEW: ${{ inputs.new }}
        run: |
          python3 - <<'EOF'
          import os, sys
          p, old, new = os.environ['P'], os.environ['OLD'], os.environ['NEW']
          root = os.path.realpath('.')
          full = os.path.realpath(p)
          if not full.startswith(root + os.sep) or not os.path.isfile(full):
              sys.exit(f'Файл не найден в репозитории: {p}')
          if os.path.relpath(full, root).split(os.sep)[0] in ('.git', '.github'):
              sys.exit('Файлы .git и .github этим способом не правятся')
          if old == new:
              sys.exit('Новый фрагмент совпадает со старым — править нечего')
          t = open(full, encoding='utf-8').read()
          c = t.count(old)
          if c != 1:
              sys.exit(f'Фрагмент найден {c} раз — нужен ровно 1')
          open(full, 'w', encoding='utf-8').write(t.replace(old, new))
          print('OK')
          EOF
          git diff --binary > "$RUNNER_TEMP/patch.diff"
      - name: node --test
        run: node --test tests/*.test.js
      - uses: actions/upload-artifact@v4
        with:
          name: patch
          path: ${{ runner.temp }}/patch.diff
          retention-days: 1

  pr:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: patch
          path: ${{ runner.temp }}
      - name: Ветка и PR
        env:
          MSG: ${{ inputs.message }}
          P: ${{ inputs.path }}
          BASE: ${{ github.ref_name }}
          BRANCH: patch/${{ github.run_id }}-${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMPARE: ${{ github.server_url }}/${{ github.repository }}/compare
          GH_TOKEN: ${{ github.token }}
        run: |
          git apply "$RUNNER_TEMP/patch.diff"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -am "${MSG:-Точечная правка}"
          git push -u origin "$BRANCH"
          BODY="Правка файла \`$P\` из workflow «Точечная правка текста». Тесты прогнаны: $RUN_URL"
          # PR от GITHUB_TOKEN не запускает tests.yml: если «Тесты» — обязательная проверка, её перезапустить вручную.
          NOTE="Проверка «Тесты» на этом PR сама не запустится (PR открыт токеном GitHub Actions); тесты прогнаны в этом запуске."
          if gh pr create --base "$BASE" --head "$BRANCH" --title "${MSG:-Точечная правка}" --body "$BODY"; then
            printf 'PR открыт.\n\n%s\n' "$NOTE" >> "$GITHUB_STEP_SUMMARY"
          else
            # Если в настройках репозитория Actions запрещено открывать PR — ссылка для ручного открытия.
            printf 'Ветка %s запушена; PR открыть вручную: %s/%s...%s?expand=1\n\n%s\n' \
              "$BRANCH" "$COMPARE" "$BASE" "$BRANCH" "$NOTE" >> "$GITHUB_STEP_SUMMARY"
          fi
