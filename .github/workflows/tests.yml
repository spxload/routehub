name: Тесты

on:
  push:
    branches: [main, stash-client]
  pull_request:
    branches: [main, stash-client]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: node --test
        run: node --test tests/*.test.js
