# =============================================================
# RouteHub — главный конфиг (routehub.conf)
# Точка входа. Раздаётся ОДНОЙ живой ссылкой Worker (/config?key=kN).
# Версия: C-draft-41, дата 2026-08-15.
#
# ИСТОРИЯ ВЕРСИЙ — CHANGELOG.md в корне репозитория. Здесь она занимала 11 КБ
# (сорок процентов файла) и мешала читать сам конфиг; ничего не потеряно.
#
# C-draft-41 ОТНОСИТЕЛЬНО C-draft-40 — СНЯТ СКРИПТ RH-RKN.
#   ПРИЧИНА: routehub-rkn.js пробивал маяки через ИМЕНА ГРУПП (RH-Проба-VPN,
#   RH-Обход), а $httpClient понимает только имена УЗЛОВ — имена групп он
#   игнорирует МОЛЧА (тест T6 от 2026-06-13). То есть скрипт с самого начала
#   ходил не туда, куда думал: детект whitelist в Этапе F срабатывал случайно,
#   а телефон будился каждые 3 минуты впустую.
#   ЧЕМ ЗАМЕНЁН: проба L10 (routehub-probe-context.js) — снимает сеть, детект
#   whitelist по пяти иностранным маякам через node:'DIRECT' и живость каждого
#   выбранного узла через node:<имя узла>. Запускается вручную, когда нужно
#   понять контекст, а не по таймеру.
#   ЧТО ОСТАЛОСЬ: группа RH-Проба-VPN сохранена (её мог бы использовать
#   будущий детектор), эндпоинт Worker POST /rkn и история rkn_hist в D1 —
#   тоже: там лежат накопленные смены режима.
#
# МОДЕЛЬ ОДНОЙ ПОДПИСКИ: Worker /nodes отдаёт оба набора (🛜/📱); каждая функция —
#   select-родитель из двух fallback-детей (-W/-C); netwatch флипает родителя по
#   сети. AI — страновые тиеры, СТРОИТ Worker. Выбор узла делает fallback.
# =============================================================

[General]
ip-mode = ipv4-only
allow-udp-proxy = true
udp-fallback-mode = REJECT
dns-server = system,1.1.1.1,77.88.8.8
doh-server = https://cloudflare-dns.com/dns-query,https://dns.google/dns-query
hijack-dns = *:53
domain-reject-mode = DNS
sni-sniffing = true
proxy-test-url = http://connectivitycheck.gstatic.com/generate_204
internet-test-url = http://www.msftconnecttest.com/connecttest.txt
test-timeout = 3
interface-mode = auto
disable-stun = false
real-ip = wpad.*,wpad,*.local,*.apple.com,*.icloud.com,time.*.com,ntp.*.com
skip-proxy = wpad.*,wpad,*.local,localhost,*.lan,*.localdomain,captive.apple.com
bypass-tun = 10.0.0.0/8,100.64.0.0/10,127.0.0.0/8,169.254.0.0/16,172.16.0.0/12,192.0.0.0/24,192.0.2.0/24,192.88.99.0/24,192.168.0.0/16,198.18.0.0/15,198.51.100.0/24,203.0.113.0/24,224.0.0.0/4,255.255.255.255/32
# disable-udp-ports — НЕ задаём (глушение UDP/443 ломало FaceTime/звонки).
# Яндекс DNS (77.88.8.8) — только plain-резерв, в doh-server НЕ добавлять (отравление РКН).

[Host]
# Дашборд rh.box — FakeIP, чтобы Safari не искал реальный домен; запрос
# перехватывает routehub-dash.js (http-request). Домен не резолвится в интернете.
rh.box = 198.18.0.1
# TikTok — маршрутизацией доменов (Этап J), без MITM/DNS-подмены.
# Опц.: точечный РФ-резолвинг через Яндекс — пример: *.gosuslugi.ru = server:77.88.8.8

[Remote Proxy]
# ЗАГЛУШКА (C-draft-38). Реальный адрес подставляет Worker: он целиком меняет
# эту строку на <origin>/t/<token>/nodes?key=kN при выдаче конфига устройству.
# ХВОСТ ПАРАМЕТРОВ после первой запятой берётся ИМЕННО ОТСЮДА (subParamsFromConf)
# и сохраняется как есть — его не удалять и не сокращать.
# block-quic=false (C-draft-35): QUIC проверен — НЕ был причиной поломок, блокировка не помогла.
Lastdep = https://routehub.invalid/nodes,udp=true,block-quic=false,fast-open=default,vmess-aead=true,skip-cert-verify=default,enabled=true,flexible-sni=false

[Remote Filter]
# Разделение по сети — МЕТКОЙ в имени (🛜/📱), regex по метке.
# (C-draft-39) Критерий VPN-узла — слово в скобочном теге: «VPN]». Ловит и
# «[VPN]», и «[🌀 VPN]», и любые будущие значки внутри скобок. «^(?!.*Обход)»
# гарантирует, что платные обходные узлы сюда не попадут ни при каком имени.
RH-Filter-W-VPN  = NameRegex, Lastdep, FilterKey = ^(?!.*Обход).*VPN].*🛜
RH-Filter-C-VPN  = NameRegex, Lastdep, FilterKey = ^(?!.*Обход).*VPN].*📱
RH-Filter-W-Игры = NameRegex, Lastdep, FilterKey = Игры.*🛜
RH-Filter-C-Игры = NameRegex, Lastdep, FilterKey = Игры.*📱
RH-Filter-W-Звонки = NameRegex, Lastdep, FilterKey = 🛜.*☎
RH-Filter-C-Звонки = NameRegex, Lastdep, FilterKey = 📱.*☎
# VPN-узлы БЕЗ ☎ (запас для звонков, без дублей с ☎-фильтром)
RH-Filter-W-VPNне☎ = NameRegex, Lastdep, FilterKey = ^(?!.*(☎|Обход)).*VPN].*🛜
RH-Filter-C-VPNне☎ = NameRegex, Lastdep, FilterKey = ^(?!.*(☎|Обход)).*VPN].*📱
RH-Filter-Обход  = NameKeyword, Lastdep, FilterKey = Обход
# --- РЕГИОНЫ (C-draft-36): только для обычного трафика RH-АВТО. ---
# Порядок внутри региона задаёт Worker (композитный балл) — фильтр его сохраняет.
# Турция, ОАЭ, Египет, Нигерия, Индия, Азия -> Прочие (геоблок европейских сайтов).
RH-Filter-W-EU = NameRegex, Lastdep, FilterKey = ^(?!.*Обход).*(🇩🇪|🇳🇱|🇫🇮|🇵🇱|🇪🇪|🇱🇻|🇱🇹|🇸🇪|🇳🇴|🇩🇰|🇮🇪|🇬🇧|🇫🇷|🇪🇸|🇮🇹|🇨🇭|🇦🇹|🇧🇪|🇨🇿|🇷🇴|🇷🇸|🇵🇹|🇬🇷|🇭🇺|🇸🇰|🇸🇮|🇭🇷|🇧🇬|🇱🇺|🇮🇸|🇲🇩|🇺🇦).*VPN].*🛜
RH-Filter-C-EU = NameRegex, Lastdep, FilterKey = ^(?!.*Обход).*(🇩🇪|🇳🇱|🇫🇮|🇵🇱|🇪🇪|🇱🇻|🇱🇹|🇸🇪|🇳🇴|🇩🇰|🇮🇪|🇬🇧|🇫🇷|🇪🇸|🇮🇹|🇨🇭|🇦🇹|🇧🇪|🇨🇿|🇷🇴|🇷🇸|🇵🇹|🇬🇷|🇭🇺|🇸🇰|🇸🇮|🇭🇷|🇧🇬|🇱🇺|🇮🇸|🇲🇩|🇺🇦).*VPN].*📱
RH-Filter-W-AM = NameRegex, Lastdep, FilterKey = ^(?!.*Обход).*(🇺🇸|🇨🇦|🇧🇷|🇦🇷|🇲🇽|🇨🇱|🇨🇴|🇵🇪).*VPN].*🛜
RH-Filter-C-AM = NameRegex, Lastdep, FilterKey = ^(?!.*Обход).*(🇺🇸|🇨🇦|🇧🇷|🇦🇷|🇲🇽|🇨🇱|🇨🇴|🇵🇪).*VPN].*📱
RH-Filter-W-RU = NameRegex, Lastdep, FilterKey = ^(?!.*Обход).*(🇷🇺|🇧🇾|🇰🇿|🇦🇲|🇬🇪|🇦🇿|🇺🇿|🇰🇬|🇹🇯).*VPN].*🛜
RH-Filter-C-RU = NameRegex, Lastdep, FilterKey = ^(?!.*Обход).*(🇷🇺|🇧🇾|🇰🇿|🇦🇲|🇬🇪|🇦🇿|🇺🇿|🇰🇬|🇹🇯).*VPN].*📱
RH-Filter-W-Прочие = NameRegex, Lastdep, FilterKey = ^(?!.*Обход)(?!.*(🇩🇪|🇳🇱|🇫🇮|🇵🇱|🇪🇪|🇱🇻|🇱🇹|🇸🇪|🇳🇴|🇩🇰|🇮🇪|🇬🇧|🇫🇷|🇪🇸|🇮🇹|🇨🇭|🇦🇹|🇧🇪|🇨🇿|🇷🇴|🇷🇸|🇵🇹|🇬🇷|🇭🇺|🇸🇰|🇸🇮|🇭🇷|🇧🇬|🇱🇺|🇮🇸|🇲🇩|🇺🇦|🇺🇸|🇨🇦|🇧🇷|🇦🇷|🇲🇽|🇨🇱|🇨🇴|🇵🇪|🇷🇺|🇧🇾|🇰🇿|🇦🇲|🇬🇪|🇦🇿|🇺🇿|🇰🇬|🇹🇯)).*VPN].*🛜
RH-Filter-C-Прочие = NameRegex, Lastdep, FilterKey = ^(?!.*Обход)(?!.*(🇩🇪|🇳🇱|🇫🇮|🇵🇱|🇪🇪|🇱🇻|🇱🇹|🇸🇪|🇳🇴|🇩🇰|🇮🇪|🇬🇧|🇫🇷|🇪🇸|🇮🇹|🇨🇭|🇦🇹|🇧🇪|🇨🇿|🇷🇴|🇷🇸|🇵🇹|🇬🇷|🇭🇺|🇸🇰|🇸🇮|🇭🇷|🇧🇬|🇱🇺|🇮🇸|🇲🇩|🇺🇦|🇺🇸|🇨🇦|🇧🇷|🇦🇷|🇲🇽|🇨🇱|🇨🇴|🇵🇪|🇷🇺|🇧🇾|🇰🇿|🇦🇲|🇬🇪|🇦🇿|🇺🇿|🇰🇬|🇹🇯)).*VPN].*📱
