[Proxy Group]
# --- Ручные / служебные ---
RH-Все = select, RH-Filter-W-VPN, RH-Filter-W-Игры, RH-Filter-Обход, img-url=https://cdn.jsdelivr.net/gh/Orz-3/mini@master/Color/Static.png
RH-Обход = fallback, RH-Filter-Обход, url=http://connectivitycheck.gstatic.com/generate_204, interval=120, max-timeout=2000, img-url=https://cdn.jsdelivr.net/gh/Orz-3/mini@master/Color/Bypass.png
# Проб-группа детекта РКН: ТОЛЬКО VPN-узлы, без обходного хвоста — иначе падение
# VPN маскируется уходом в обход и whitelist не детектится. Скрипт RH-RKN снят
# в C-draft-41, группа оставлена: пригодится будущему детектору.
RH-Проба-VPN = fallback, RH-Filter-W-VPN, RH-Filter-C-VPN, url=http://connectivitycheck.gstatic.com/generate_204, interval=120, max-timeout=2000, img-url=https://cdn.jsdelivr.net/gh/Orz-3/mini@master/Color/Available.png
# --- Слабый DIRECT по умолчанию (Loon пробивает DIRECT в fallback — тест Этапа F) ---
# РФ-сервисы не в whitelist + GEOIP-RU: норма DIRECT, whitelist -> обход.
RH-RU = fallback, DIRECT, RH-Обход, url=http://connectivitycheck.gstatic.com/generate_204, interval=120, max-timeout=2000, img-url=https://cdn.jsdelivr.net/gh/Orz-3/mini@master/Color/Direct.png
# FINAL: прочий иностранный — норма DIRECT, whitelist -> RH-АВТО (VPN->игры->обход).
RH-Главный = select, DIRECT, RH-АВТО, url=http://connectivitycheck.gstatic.com/generate_204, interval=120, max-timeout=2000, img-url=https://cdn.jsdelivr.net/gh/Orz-3/mini@master/Color/Final.png
# --- AI: родитель select (netwatch флипает) + дети fallback. Тиеры строит Worker. ---
# __RH_AI_GROUPS__
# --- Обычный трафик: Европа -> Америка -> Россия/СНГ -> прочие -> игры -> обход ---
# (C-draft-36) RH-Filter-*-VPN больше НЕ используется здесь — его заменил каскад
# регионов; сам фильтр оставлен, он нужен RH-Все и RH-Проба-VPN.
RH-АВТО = select, RH-АВТО-W, RH-АВТО-C, img-url=https://cdn.jsdelivr.net/gh/Orz-3/mini@master/Color/Auto.png
RH-АВТО-W = fallback, RH-Filter-W-EU, RH-Filter-W-AM, RH-Filter-W-RU, RH-Filter-W-Прочие, RH-Filter-W-Игры, RH-Filter-Обход, url=http://connectivitycheck.gstatic.com/generate_204, interval=120, max-timeout=2000
RH-АВТО-C = fallback, RH-Filter-C-EU, RH-Filter-C-AM, RH-Filter-C-RU, RH-Filter-C-Прочие, RH-Filter-C-Игры, RH-Filter-Обход, url=http://connectivitycheck.gstatic.com/generate_204, interval=120, max-timeout=2000
# --- Звонки: голосовой маркер ☎ (jit/bl/med в норме) -> VPN-без-☎ -> обход ---
RH-Звонки = select, RH-Звонки-W, RH-Звонки-C, img-url=https://cdn.jsdelivr.net/gh/Orz-3/mini@master/Color/Available.png
RH-Звонки-W = fallback, RH-Filter-W-Звонки, RH-Filter-W-VPNне☎, RH-Filter-Обход, url=http://connectivitycheck.gstatic.com/generate_204, interval=120, max-timeout=2000
RH-Звонки-C = fallback, RH-Filter-C-Звонки, RH-Filter-C-VPNне☎, RH-Filter-Обход, url=http://connectivitycheck.gstatic.com/generate_204, interval=120, max-timeout=2000

